<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #F1F3EF;
    --surface: #FFFFFF;
    --ink: #14203A;
    --muted: #5A6479;
    --line: #DADFE2;
    --accent: #0E6B64;
    --accent-ink: #FFFFFF;
    --accent-soft: #DDEFEC;
    --chrome: #E6EAEC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E141C; --surface: #151D28; --ink: #E8ECF2; --muted: #9AA4B6;
      --line: #263243; --accent: #5EC6BC; --accent-ink: #08201E; --accent-soft: #163633; --chrome: #1C2633;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E141C; --surface: #151D28; --ink: #E8ECF2; --muted: #9AA4B6;
    --line: #263243; --accent: #5EC6BC; --accent-ink: #08201E; --accent-soft: #163633; --chrome: #1C2633;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    font-size: 1rem; line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

  /* Top */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 700; font-size: .95rem; text-decoration: none; direction: ltr;
  }
  .lang {
    font: inherit; font-size: .9rem; color: var(--ink); background: transparent;
    border: 1px solid var(--line); padding: .35rem 1rem; border-radius: 999px; cursor: pointer;
  }
  .lang:hover { border-color: var(--accent); }

  /* Intro */
  .intro { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2.5rem; align-items: end; padding: 3rem 0 3.25rem; }
  .intro h1 { font-size: clamp(2.4rem, 6.4vw, 4.4rem); line-height: 1.08; font-weight: 600; margin: 0 0 1rem; letter-spacing: -.015em; }
  .intro .role { font-size: clamp(1.1rem, 2.2vw, 1.35rem); margin: 0 0 1rem; color: var(--accent); font-weight: 500; }
  .intro p.bio { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 34em; }
  .side { display: grid; gap: 1.25rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; font-weight: 500; font-size: .95rem;
    padding: .65rem 1.15rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:hover { border-color: var(--accent); }
  .stack { font-size: .9rem; color: var(--muted); margin: 0; }
  .stack b { color: var(--ink); font-weight: 500; }

  /* Work */
  .work { padding: 1rem 0 2rem; }
  .work-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-top: 1px solid var(--line); padding-top: 1.5rem; margin-bottom: 1.5rem; }
  .work-head h2 { font-size: 1.35rem; font-weight: 600; margin: 0; }
  .work-head span { color: var(--muted); font-size: .95rem; }
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem 1.5rem; }

  .card { position: relative; display: flex; flex-direction: column; }
  .shot {
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface);
  }
  .chrome { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; background: var(--chrome); direction: ltr; }
  .dots { display: flex; gap: 5px; flex: none; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
  .addr {
    flex: 1; min-width: 0; font-size: .82rem; color: var(--muted); background: var(--surface);
    border-radius: 6px; padding: .15rem .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .frame { aspect-ratio: 16 / 7; overflow: hidden; background: var(--chrome); }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .card:hover .frame img { transform: scale(1.02); }
  @media (prefers-reduced-motion: no-preference) {
    .frame img { transition: transform .5s ease; }
    .btn, .lang, .visit { transition: border-color .15s, color .15s, background-color .15s; }
  }

  .meta { padding: 1rem .15rem 0; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
  .kind { font-size: .85rem; color: var(--accent); font-weight: 500; }
  .meta h3 { margin: 0; font-size: 1.2rem; font-weight: 600; line-height: 1.35; }
  .meta p { margin: 0; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .5rem; flex-wrap: wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0; margin: 0; list-style: none; direction: ltr; }
  .tags li { font-size: .78rem; padding: .1rem .55rem; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .visit { font-size: .9rem; font-weight: 500; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: .35rem; }
  .visit svg { width: 15px; height: 15px; }
  [dir="rtl"] .visit svg { transform: scaleX(-1); }
  .visit::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
  .card:hover .visit { text-decoration: underline; text-underline-offset: 4px; }

  footer { border-top: 1px solid var(--line); margin-top: 2rem; padding: 1.75rem 0 3rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; color: var(--muted); font-size: .9rem; }
  footer a { text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  @media (max-width: 860px) {
    .intro { grid-template-columns: 1fr; gap: 1.75rem; padding-top: 1.5rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>

  const projects = [

              en: "Bilingual site for a Saudi kitchen manufacturer: product catalogue, project gallery, and forms for measurement requests and maintenance booking." },
      tags: ["WordPress", "RTL", "AR / EN", "Forms"] },
    { id: "hz", url: "https://hzwholesale.com/",
      kind: { ar: "متجر جملة", en: "Wholesale store" },
      name: { ar: "HZ Wholesale", en: "HZ Wholesale" },
      desc: { ar: "متجر جملة لموزعي الإلكترونيات (هواتف، أجهزة لوحية، إكسسوارات) مع إدارة المنتجات ومسار الطلب ومدونة.",
              en: "Wholesale store for electronics resellers (phones, tablets, accessories) with product management, ordering flow and a blog." },
      tags: ["WordPress", "WooCommerce"] },
    { id: "rubens", url: "https://rubenstires.com/",
      kind: { ar: "مركز إطارات وصيانة سيارات", en: "Tire & auto repair shop" },
      name: { ar: "Ruben's Tires", en: "Ruben's Tires" },
      desc: { ar: "موقع ومتجر لمركز إطارات وصيانة سيارات: صفحات مصممة بـ Elementor، وإدارة المنتجات ومسار الدفع وبوابات الدفع.",
              en: "Site and store for a tire and auto repair shop: Elementor-built pages, product management, checkout flow and payment gateways." },
      tags: ["WooCommerce", "Elementor", "CF7"] },
    { id: "omega", url: "https://omegatrove.com/",
      kind: { ar: "وكالة تسويق رقمي", en: "Digital marketing agency" },
      name: { ar: "Omega Trove Consulting", en: "Omega Trove Consulting" },
      desc: { ar: "موقع وكالة تسويق وبراندينج في فلوريدا: تخصيص القالب بتصميم متجاوب وعناصر تفاعلية.",

    { id: "codezilla", url: "https://itscodezilla.com/",
      kind: { ar: "شركة برمجيات", en: "Software agency" },

  const t = {

      bio: "أبني مواقع ووردبريس ومتاجر WooCommerce سريعة ومتجاوبة ومتعددة اللغات: من تحويل التصميم إلى قالب، إلى ربط منصات التعلم و SSO وتحسين الأداء و SEO.",
      email: "راسلني", stackLabel: "أعمل بـ", workTitle: "مواقع منشورة",
      workNote: projects.length + " مواقع، اضغط على أي موقع لزيارته",
      visit: "زيارة الموقع", footer: "عبدالرحمن محمد – مطور ووردبريس", toggle: "English",
      title: "عبدالرحمن محمد | مطور ووردبريس", alt: "صورة من موقع "
    },
    en: {
      name: "Abdelrahman Mohamed", role: "WordPress Developer – Cairo",
      bio: "I build fast, responsive, multilingual WordPress sites and WooCommerce stores: from design-to-theme conversion to LMS and SSO integrations, performance and SEO.",

      visit: "Visit site", footer: "Abdelrahman Mohamed – WordPress Developer", toggle: "العربية",
      title: "Abdelrahman Mohamed | WordPress Developer", alt: "Screenshot of "
    }
  };

  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

  function render(lang) {
    const g = document.getElementById("grid");
    g.innerHTML = "";
    projects.forEach(p => {
      const host = p.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
      const li = document.createElement("li");
      li.className = "card";
      li.innerHTML = `
        <div class="shot">
          <div class="chrome" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="addr">${host}</span></div>
          <div class="frame"><img src="img/${p.id}.avif" width="640" height="290" loading="lazy" decoding="async" alt="${t[lang].alt}${p.name[lang]}"></div>
        </div>
        <div class="meta">
          <span class="kind">${p.kind[lang]}</span>
          <h3>${p.name[lang]}</h3>
          <p>${p.desc[lang]}</p>
          <div class="row">
            <ul class="tags">${p.tags.map(x => `<li>${x}</li>`).join("")}</ul>
            <a class="visit" href="${p.url}" target="_blank" rel="noopener">${t[lang].visit} ${arrow}</a>
          </div>
        </div>`;
      g.appendChild(li);
    });
  }

  function setLang(lang) {
    const h = document.documentElement;
    h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t[lang].title;
    document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[lang][el.dataset.i]; });
    document.getElementById("lang").textContent = t[lang].toggle;
    render(lang);
    try { localStorage.setItem("pf-lang", lang); } catch (e) {}
  }

  let cur = "ar";
  try { const s = localStorage.getItem("pf-lang"); if (s === "ar" || s === "en") cur = s; } catch (e) {}
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ar" || q === "en") cur = q;
  document.getElementById("lang").addEventListener("click", () => { cur = cur === "ar" ? "en" : "ar"; setLang(cur); });
  setLang(cur);
</script>
